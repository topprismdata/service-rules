[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "service-rules"
version = "0.2.0"
description = "Versioned service rules (visit frequency / contract cadence-phase / time windows) with pre-publish conflict detection and GeoGov DQ DSL-typed verdicts; one-click rollback."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TopPrism WP07" }]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["service_rules*"]
